name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pytest

      - name: V1 validate-collated（只允许存量 d59f1iqd854w/default/108.md）
        run: |
          python3 scripts/validate-collated.py --root . --json > v1.json
          python3 - <<'EOF'
          import json, sys
          d = json.load(open('v1.json', encoding='utf-8'))
          known = {('Work:d59f1iqd854w/default', '磁盘上有未登记的章文件')}
          extra = [p for p in d['problems'] if (p['wid'], p['kind']) not in known]
          print(f"owners {d['n_owners']}, versions {d['n_versions']}, problems {len(d['problems'])}, new {len(extra)}")
          for p in extra:
              print(f"新问题: {p}")
          sys.exit(1 if extra else 0)
          EOF
        env:
          BOOK_TEXT_REPO: ${{ github.workspace }}

      - name: V2 validate_text_format --strict
        run: python3 scripts/validate_text_format.py . --strict --baseline scripts/format_baseline.json

      - name: V3 check_license
        run: python3 scripts/check_license.py .

      - name: license unit test
        run: python3 -m pytest scripts/tests -k license -q
