name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 读 guji-format 固定版本
        id: pin
        # 固定到已核对的 commit，不跟着 main 漂（overview#543，Maren）；改 pin 只改 .github/guji-format.pin 一行
        run: echo "ref=$(tr -d '[:space:]' < .github/guji-format.pin)" >> "$GITHUB_OUTPUT"

      - name: checkout guji-format (schemas)
        uses: actions/checkout@v4
        with:
          repository: open-guji/guji-format
          ref: ${{ steps.pin.outputs.ref }}
          path: guji-format

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install jsonschema pytest

      - name: manifest / index schema
        run: |
          python3 - <<'EOF'
          import glob, json, os, sys
          import jsonschema
          gf = 'guji-format/schemas'
          M = jsonschema.Draft202012Validator(json.load(open(os.path.join(gf, 'book_text_manifest_v1.schema.json'))))
          I = jsonschema.Draft202012Validator(json.load(open(os.path.join(gf, 'book_text_index_v1.schema.json'))))
          mf = sorted(glob.glob('Work/*/*/*/*/manifest.json') + glob.glob('Book/*/*/*/*/manifest.json'))
          ix = sorted(glob.glob('Work/*/*/*/*/*/index.json') + glob.glob('Book/*/*/*/*/*/index.json'))
          bad = []
          for p, v in [(p, M) for p in mf] + [(p, I) for p in ix]:
              e = next(v.iter_errors(json.load(open(p, encoding='utf-8'))), None)
              if e:
                  bad.append((p, e.message[:150]))
          print(f'manifests {len(mf)}, indexes {len(ix)}, violations {len(bad)}')
          for p, m in bad[:20]:
              print(f'违规: {p}: {m}')
          sys.exit(1 if bad else 0)
          EOF

      - name: V1 validate-collated（只允许存量 d59f1iqd854w/default/108.md）
        run: |
          python3 scripts/validate-collated.py --root . --json > v1.json
          python3 - <<'EOF'
          import json, sys
          d = json.load(open('v1.json', encoding='utf-8'))
          known = {('Work:d59f1iqd854w/default', '磁盘上有未登记的章文件')}
          extra = [p for p in d['problems'] if (p['wid'], p['kind']) not in known]
          print(f"owners {d['n_owners']}, versions {d['n_versions']}, problems {len(d['problems'])}, new {len(extra)}")
          for p in extra:
              print(f"新问题: {p}")
          sys.exit(1 if extra else 0)
          EOF
        env:
          BOOK_TEXT_REPO: ${{ github.workspace }}

      - name: V2 validate_text_format --strict
        run: python3 scripts/validate_text_format.py . --strict --baseline scripts/format_baseline.json

      - name: V3 check_license
        run: python3 scripts/check_license.py .

      - name: decision 夹具哈希（与 guji-format 副本一致）
        run: cd scripts/tests/fixtures/decision && sha256sum -c SHA256SUMS

      - name: unit tests (scripts/tests, scripts/book-text/tests)
        run: python3 -m pytest scripts/tests scripts/book-text/tests -q

  pin-drift:
    # guji-format main 的 schemas/ 与 pin 处不同＝schema 已变而本仓没跟上：此作业红。
    # 不阻塞合并（continue-on-error），但 PR 页上能看到；处理办法见 docs/GUJI-FORMAT-PIN.md
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: checkout guji-format（含历史）
        uses: actions/checkout@v4
        with:
          repository: open-guji/guji-format
          ref: main
          fetch-depth: 0
          path: guji-format

      - name: schemas/ 树哈希：pin vs main
        run: |
          pin=$(tr -d '[:space:]' < .github/guji-format.pin)
          main=$(git -C guji-format rev-parse HEAD)
          a=$(git -C guji-format rev-parse "$pin:schemas")
          b=$(git -C guji-format rev-parse "$main:schemas")
          echo "pin  $pin  schemas=$a"
          echo "main $main schemas=$b"
          if [ "$a" != "$b" ]; then
            echo "::error::guji-format main 的 schemas/ 与 pin 不同：请按 docs/GUJI-FORMAT-PIN.md 开 bump pin 的 PR"
            git -C guji-format diff --stat "$pin" "$main" -- schemas | tail -10
            exit 1
          fi
          echo "pin 与 main 的 schemas/ 一致"
